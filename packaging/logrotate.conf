# tool.log self-rotates by size (5 MiB, 3 backups) — this file is only a
# safety net. It must NEVER touch /var/lib/poolwarden/audit.jsonl: the audit
# writer rotates it daily and enforces retention itself.
/var/lib/poolwarden/tool.log {
    weekly
    rotate 4
    missingok
    copytruncate
    notifempty
}
