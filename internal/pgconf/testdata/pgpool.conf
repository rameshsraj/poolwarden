# ----------------------------
# pgPool-II configuration file
# ----------------------------
#
# This file consists of lines of the form:
#
#   name = value
#
# COMMENTS
#--------

# CONNECTIONS

listen_addresses = 'localhost'
port = 9999
pcp_listen_addresses = 'localhost'
pcp_port = 9898
#unix_socket_directories = '/tmp'
#unix_socket_group = ''
#unix_socket_permissions = 0777
#pcp_socket_dir = '/tmp'
#reserved_connections = 0

# - Backend Connection Settings -

backend_hostname0 = 'db1'
backend_port0 = 5432
backend_weight0 = 1
backend_data_directory0 = '/var/lib/pgsql/data'
backend_flag0 = 'ALLOW_TO_FAILOVER'
backend_application_name0 = 'db1'

backend_hostname1 = 'db2'
backend_port1 = 5432
backend_weight1 = 1
backend_data_directory1 = '/var/lib/pgsql/data'
backend_flag1 = 'ALLOW_TO_FAILOVER'
backend_application_name1 = 'db2'

# AUTHENTICATION

enable_pool_hba = off
pool_passwd = 'pool_passwd'
#authentication_timeout = 60
#allow_clear_text_frontend_auth = off

# POOLS

#pool_size = 4
#num_init_children = 32
num_init_children = 32
max_pool = 4
#child_life_time = 300
#child_max_connections = 0
#connection_life_time = 0
#client_idle_limit = 0

# LOGGING

#log_destination = 'syslog'
log_line_prefix = '%m: %a pid %p: '    # printf-style string to output at beginning of each log line.
#log_connections = off
#log_hostname = off
#log_statement = off
#log_per_node_statement = off
#log_client_messages = off
#log_standby_delay = 'none'
#syslog_facility = 'LOCAL0'
#syslog_ident = 'pgpool'
logdir = '/var/log/pgpool'

# LOAD BALANCING

load_balance_mode = on
#ignore_leading_white_space = on
#white_function_list = ''
#black_function_list = 'nextval,setval'
#database_redirect_preference_list = ''
#app_name_redirect_preference_list = ''
#allow_sql_comments = off
#disable_load_balance_on_write = 'transaction'
#statement_level_load_balance = off

# HEALTH CHECK

health_check_period = 0
#health_check_timeout = 20
#health_check_user = 'nobody'
#health_check_password = ''
#health_check_database = ''
#health_check_max_retries = 0
#health_check_retry_delay = 1
#connect_timeout = 10000

# FAILOVER AND FAILBACK

failover_command = ''
follow_primary_command = ''
#failback_command = ''
#failover_on_backend_error = on
#failover_on_backend_shutdown = on
#failover_when_quorum_exists = on
#failover_require_consensus = on
#detach_false_primary = off
#search_primary_node_timeout = 5min
#auto_failback = off
#auto_failback_interval = 1min

# ONLINE RECOVERY

#recovery_user = 'nobody'
#recovery_password = ''
#recovery_1st_stage_command = ''
#recovery_2nd_stage_command = ''
#recovery_timeout = 90
#client_idle_limit_in_recovery = 0

# WATCHDOG

#use_watchdog = off
use_watchdog = on
#trusted_servers = ''
#ping_path = '/bin'
#wd_hostname = ''
hostname0 = 'pgp1'
wd_port0 = 9000
pgpool_port0 = 9999
hostname1 = 'pgp2'
wd_port1 = 9000
pgpool_port1 = 9999
wd_priority = 1
#wd_authkey = ''
#wd_ipc_socket_dir = '/tmp'
#wd_monitoring_interfaces_list = ''
#wd_interval = 10
#wd_life_point = 3
#wd_lifecheck_query = 'SELECT 1'
#wd_lifecheck_user = 'nobody'
#wd_lifecheck_password = ''
#wd_lifecheck_dbname = 'template1'
#wd_lifecheck_method = 'heartbeat'
#wd_heartbeat_port = 9694
#wd_heartbeat_keepalive = 2
#wd_heartbeat_deadtime = 30
#heartbeat_destination0 = 'host0_ip_1'
#heartbeat_destination_port0 = 9694
#heartbeat_device0 = ''
delegate_ip = '10.0.0.100'
if_up_cmd = '/bin/true'
if_down_cmd = '/bin/true'
#arping_path = '/usr/sbin'
#arping_cmd = ''
#clear_memqcache_on_escalation = on
#wd_escalation_command = ''
#wd_de_escalation_command = ''
#failover_when_quorum_exists = on
#failover_require_consensus = on
#enable_consensus_with_half_votes = off
enable_consensus_with_half_votes = off
#allow_multiple_failover_requests_from_node = off
#wd_remove_shutdown_nodes = off

# STREAMING REPLICATION CHECK

#sr_check_period = 0
#sr_check_user = 'nobody'
#sr_check_password = ''
#sr_check_database = 'postgres'
#delay_threshold = 0
#delay_threshold_by_time = 0
#preferred_main_clusters = ''
#detach_false_primary = off

# MISC

#memory_cache_enabled = off
#memqcache_oiddir = '/var/log/pgpool/oiddir'
#memqcache_expire = 0
#memqcache_total_size = 64MB
#wd_notify_on_primary_change = off
logdir_with_hash = '#not-comment'   # value containing a hash char
#relcache_expire = 0
#relcache_size = 256
#check_temp_table = 'catalog'
#check_unlogged_table = 'on'

